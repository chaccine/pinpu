<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04060b">
  <meta name="description" content="纯前端音乐频谱可视化，支持本地音频、麦克风与合成演示曲目。">
  <title>频谱 · 音乐可视化</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='21'%20fill='none'%20stroke='%235ce1ff'%20stroke-width='8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme-panel.css">
  <link rel="stylesheet" href="css/dock.css">
  <link rel="stylesheet" href="css/playlist.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <canvas id="stage" aria-label="音乐频谱可视化画布"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar ui">
    <div class="brand">
      <span class="pulse-dot" aria-hidden="true"></span>
      <h1>频谱</h1>
      <span class="tagline">音乐可视化</span>
    </div>
    <div class="top-actions">
      <span class="source-tag" id="sourceTag">未连接</span>
      <button class="icon-btn" id="btnFullscreen" type="button" title="全屏（F）" aria-label="切换全屏">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </svg>
      </button>
    </div>
  </header>

  <p class="hint" id="hint">拖入音频文件，或点击下方「演示曲目」开始</p>

  <section class="dock ui" id="dock" aria-label="控制面板">
    <div class="dock-row sources">
      <button class="chip chip-demo" id="btnDemo" type="button" aria-label="播放演示曲目">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 18V6l10-2v12" />
          <circle cx="6.5" cy="18" r="2.5" />
          <circle cx="16.5" cy="16" r="2.5" />
        </svg>
        <span>演示曲目</span>
      </button>
      <button class="chip" id="btnFile" type="button" aria-label="选择本地音频文件">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 16V4M7 9l5-5 5 5M5 20h14" />
        </svg>
        <span>本地音频</span>
      </button>
      <button class="chip" id="btnMic" type="button" aria-label="使用麦克风输入">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
        </svg>
        <span>麦克风</span>
      </button>
      <input id="fileInput" type="file" accept="audio/*" multiple hidden>
    </div>

    <div class="dock-row nowplaying" id="nowPlaying" hidden>
      <span class="np-cover" id="npCover" aria-hidden="true"></span>
      <span class="np-text"><span class="np-marquee" id="npTitle">—</span></span>
    </div>

    <div class="dock-row transport">
      <button class="skip-btn" id="btnPrev" type="button" title="上一首" aria-label="上一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6v12L9 12z" /><path d="M6 5v14" /></svg>
      </button>
      <button class="play-btn" id="btnPlay" type="button" aria-label="播放">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z" /></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" /></svg>
      </button>
      <button class="skip-btn" id="btnNext" type="button" title="下一首" aria-label="下一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l9-6z" /><path d="M18 5v14" /></svg>
      </button>
      <span class="time" id="timeNow">0:00</span>
      <div class="range-wrap">
        <input id="progress" class="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度">
        <span class="progress-tip" id="progressTip" hidden>0:00</span>
      </div>
      <span class="time" id="timeTotal">0:00</span>
      <button class="skip-btn" id="btnMute" type="button" title="静音（M）" aria-label="静音">
        <svg class="icon-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l4 3V7l-4 3z" /><path d="M15 9.5a3.5 3.5 0 0 1 0 5M17.5 7.5a6.5 6.5 0 0 1 0 9" /></svg>
        <svg class="icon-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l4 3V7l-4 3z" /><path d="M16 10l4 4M20 10l-4 4" /></svg>
      </button>
      <input id="volume" class="volume" type="range" min="0" max="100" value="100" step="1" aria-label="音量">
    </div>

    <div class="dock-row mode-row" role="group" aria-label="视觉模式">
      <button class="mode is-active" type="button" data-mode="0" aria-label="视觉模式：环形频谱" aria-pressed="true">环形频谱</button>
      <button class="mode" type="button" data-mode="1" aria-label="视觉模式：镜像波形" aria-pressed="false">镜像波形</button>
      <button class="mode" type="button" data-mode="2" aria-label="视觉模式：粒子星系" aria-pressed="false">粒子星系</button>
      <button class="mode" type="button" data-mode="3" aria-label="视觉模式：律动封面环" aria-pressed="false">律动封面环</button>
      <button class="mode" type="button" data-mode="4" aria-label="视觉模式：3D波形地形" aria-pressed="false">3D波形地形</button>
    </div>
  </section>

  <div class="drop-veil" id="dropVeil" aria-hidden="true">
    <div class="drop-card">
      <strong>松手即可载入音频</strong>
      <span>支持 MP3 / WAV / OGG / M4A 等格式</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
